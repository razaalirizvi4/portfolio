<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#E95420"/>
  <!-- Ubuntu circle-of-friends: three members joined at a central ring -->
  <g fill="#FFFFFF">
    <!-- central ring -->
    <circle cx="50" cy="50" r="8" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <!-- three nodes at 0°, 120°, 240° (rotated so one points left) -->
    <g>
      <circle cx="20" cy="50" r="8.5"/>
      <rect x="27" y="46.5" width="16" height="7" rx="3.5"/>
    </g>
    <g transform="rotate(120 50 50)">
      <circle cx="20" cy="50" r="8.5"/>
      <rect x="27" y="46.5" width="16" height="7" rx="3.5"/>
    </g>
    <g transform="rotate(240 50 50)">
      <circle cx="20" cy="50" r="8.5"/>
      <rect x="27" y="46.5" width="16" height="7" rx="3.5"/>
    </g>
  </g>
</svg>
