<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nobleBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2137"/>
      <stop offset="0.55" stop-color="#5B2160"/>
      <stop offset="0.82" stop-color="#77216F"/>
      <stop offset="1" stop-color="#E95420"/>
    </linearGradient>
    <radialGradient id="nobleGlow" cx="0.86" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#F19A5A" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#E95420" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#nobleBase)"/>
  <rect width="1920" height="1080" fill="url(#nobleGlow)"/>

  <!-- Low-poly facets: subtle triangular sheen over the gradient -->
  <g opacity="0.5" stroke="#000000" stroke-opacity="0.04" stroke-width="1">
    <polygon points="0,0 520,0 260,340" fill="#ffffff" fill-opacity="0.04"/>
    <polygon points="520,0 260,340 640,300" fill="#000000" fill-opacity="0.05"/>
    <polygon points="520,0 1040,0 640,300" fill="#ffffff" fill-opacity="0.03"/>
    <polygon points="1040,0 640,300 1180,360" fill="#000000" fill-opacity="0.06"/>
    <polygon points="1040,0 1560,0 1180,360" fill="#ffffff" fill-opacity="0.05"/>
    <polygon points="1560,0 1920,0 1920,320" fill="#000000" fill-opacity="0.04"/>
    <polygon points="1560,0 1180,360 1920,320" fill="#ffffff" fill-opacity="0.06"/>
    <polygon points="0,0 260,340 0,520" fill="#000000" fill-opacity="0.06"/>
    <polygon points="260,340 640,300 520,720" fill="#ffffff" fill-opacity="0.05"/>
    <polygon points="640,300 1180,360 900,700" fill="#000000" fill-opacity="0.05"/>
    <polygon points="1180,360 1920,320 1620,720" fill="#ffffff" fill-opacity="0.06"/>
    <polygon points="1180,360 900,700 1620,720" fill="#000000" fill-opacity="0.06"/>
    <polygon points="260,340 520,720 0,520" fill="#ffffff" fill-opacity="0.03"/>
    <polygon points="0,520 520,720 0,900" fill="#000000" fill-opacity="0.07"/>
    <polygon points="520,720 900,700 700,1080" fill="#ffffff" fill-opacity="0.04"/>
    <polygon points="900,700 1620,720 1300,1080" fill="#000000" fill-opacity="0.05"/>
    <polygon points="1620,720 1920,320 1920,1080" fill="#ffffff" fill-opacity="0.05"/>
    <polygon points="1620,720 1300,1080 1920,1080" fill="#000000" fill-opacity="0.06"/>
    <polygon points="0,900 520,720 700,1080" fill="#000000" fill-opacity="0.05"/>
    <polygon points="0,900 700,1080 0,1080" fill="#ffffff" fill-opacity="0.03"/>
    <polygon points="900,700 700,1080 1300,1080" fill="#ffffff" fill-opacity="0.04"/>
  </g>

  <!-- Big subtle numbat-like curl silhouette, bottom-right -->
  <g transform="translate(1360,560)" opacity="0.16">
    <path d="M120 420
             C 40 420 -30 350 -20 250
             C -10 150 70 90 180 100
             C 300 110 380 200 380 320
             C 380 250 320 190 240 190
             C 150 190 100 250 110 330
             C 118 392 170 430 250 420
             C 150 470 60 470 120 420 Z"
          fill="#1B1526"/>
    <path d="M180 100 C 250 60 340 70 400 130 C 350 120 300 130 270 160 C 240 120 210 108 180 100 Z"
          fill="#1B1526"/>
  </g>
</svg>
