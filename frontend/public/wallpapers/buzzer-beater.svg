<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="arenaBg" cx="0.5" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#20263A"/>
      <stop offset="1" stop-color="#0E1220"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#arenaBg)"/>

  <!-- scoreboard -->
  <g transform="translate(560,120)">
    <rect x="0" y="0" width="800" height="240" rx="24" fill="#0A0D16" stroke="#2A3350" stroke-width="4"/>
    <text x="150" y="90"  text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="40" font-weight="700" fill="#8AA0C8" letter-spacing="4">HOME</text>
    <text x="650" y="90"  text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="40" font-weight="700" fill="#8AA0C8" letter-spacing="4">GUEST</text>
    <text x="150" y="180" text-anchor="middle" font-family="Ubuntu Mono, monospace" font-size="96" font-weight="700" fill="#33D17A">92</text>
    <text x="400" y="170" text-anchor="middle" font-family="Ubuntu Mono, monospace" font-size="64" fill="#E95420">—</text>
    <text x="650" y="180" text-anchor="middle" font-family="Ubuntu Mono, monospace" font-size="96" font-weight="700" fill="#ED5D5D">90</text>
    <rect x="300" y="196" width="200" height="34" rx="8" fill="#1A0A0A"/>
    <text x="400" y="222" text-anchor="middle" font-family="Ubuntu Mono, monospace" font-size="26" font-weight="700" fill="#FF4D4D" letter-spacing="2">00:00.0</text>
  </g>

  <!-- hoop, top-right -->
  <g transform="translate(1560,470)">
    <rect x="80" y="-120" width="18" height="260" fill="#39405A"/>
    <rect x="-40" y="-120" width="130" height="90" rx="6" fill="none" stroke="#DCE3F0" stroke-width="6"/>
    <rect x="-6" y="-70" width="54" height="38" fill="none" stroke="#E95420" stroke-width="5"/>
    <ellipse cx="-40" cy="0" rx="52" ry="14" fill="none" stroke="#E9601F" stroke-width="7"/>
    <!-- net -->
    <g stroke="#DCE3F0" stroke-opacity="0.6" stroke-width="2">
      <path d="M-90 4 L-70 60"/><path d="M-70 6 L-58 62"/><path d="M-48 8 L-46 64"/>
      <path d="M-24 8 L-30 64"/><path d="M-2 6 L-16 60"/><path d="M12 4 L-6 56"/>
      <path d="M-90 30 L12 30" stroke-opacity="0.35"/>
    </g>
  </g>

  <!-- ball mid-arc toward the hoop -->
  <path d="M640 780 Q 1120 260 1520 470" fill="none" stroke="#E95420" stroke-width="4" stroke-dasharray="10 14" stroke-opacity="0.6"/>
  <g transform="translate(1140,430)">
    <circle cx="0" cy="0" r="40" fill="#E9601F" stroke="#8A3B10" stroke-width="3"/>
    <path d="M-40 0 H40 M0 -40 V40 M-34 -22 Q 0 0 34 -22 M-34 22 Q 0 0 34 22" fill="none" stroke="#5A2408" stroke-width="3"/>
  </g>

  <!-- floor line -->
  <rect x="0" y="980" width="1920" height="100" fill="#141A2A"/>
  <line x1="0" y1="980" x2="1920" y2="980" stroke="#2A3350" stroke-width="4"/>
</svg>
